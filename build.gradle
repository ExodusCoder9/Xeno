// Root aggregator project.
// Each loader-specific module lives in its own subproject and is configured
// in its own build.gradle. This file intentionally applies no plugins.

allprojects {
	group = rootProject.mod_group
	version = rootProject.mod_version
}

subprojects {
	plugins.withType(JavaPlugin) {
		java.toolchain.languageVersion = JavaLanguageVersion.of(25)
		java.toolchain.vendor = JvmVendorSpec.MICROSOFT
	}
}